[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = [
    "EDA.ipynb",
    "mlartifacts",
    "mlruns",
    "reports",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"app/api.py" = ["B008"]
"app/streamlit_app.py" = ["E402", "I001"]
"python_script/benchmark_inference.py" = ["E402", "I001"]
